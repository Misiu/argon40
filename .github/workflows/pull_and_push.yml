name: Pull & push actions

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
      - name: Validate hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  lint:
    runs-on: ubuntu-latest
    name: Lint and formatting
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Install development tools
        run: uv sync --frozen --dev
      - name: Run Ruff linter
        run: uv run --frozen ruff check --output-format=github .
      - name: Check Ruff formatting
        run: uv run --frozen ruff format --check .
      - name: Run repository hooks
        run: uv run --frozen prek run --all-files --show-diff-on-failure
        env:
          PREK_SKIP: ruff-check,ruff-format,no-commit-to-branch

  syntax:
    runs-on: ubuntu-latest
    name: Python syntax (3.14)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Check integration syntax
        run: uv run --no-project python -m compileall -q custom_components/argon40
