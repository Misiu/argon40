name: Pull & push actions

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
      - name: Validate hassfest
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  lint:
    runs-on: ubuntu-latest
    name: Lint and formatting
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Install development tools
        run: uv sync --frozen --dev
      - name: Run Ruff linter
        run: uv run --frozen ruff check --output-format=github .
      - name: Check Ruff formatting
        run: uv run --frozen ruff format --check .
      - name: Run repository hooks
        run: uv run --frozen prek run --all-files --show-diff-on-failure
        env:
          PREK_SKIP: ruff-check,ruff-format,no-commit-to-branch

  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover Python versions used by Home Assistant since our minimum 2025.1.
        python-version: ["3.12", "3.13", "3.14"]
    name: Python syntax (${{ matrix.python-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Check integration syntax
        run: uv run --no-project python -m compileall -q custom_components/argon40
