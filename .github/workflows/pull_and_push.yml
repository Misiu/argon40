name: Pull & push actions

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v4.2.2"

        - name: HACS Action
          uses: "hacs/action@main"
          with:
            category: "integration"

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          # Cover Python versions used by Home Assistant since our minimum 2025.1.
          - "3.12"
          - "3.13"
          - "3.14"
    name: Python checks (${{ matrix.python-version }})
    steps:
        - uses: "actions/checkout@v4.2.2"
        - uses: "actions/setup-python@v5.6.0"
          with:
            python-version: ${{ matrix.python-version }}
        - name: Check integration syntax
          run: python -m compileall -q custom_components/argon40
        - run: python3 -m pip install black
        - run: black .
