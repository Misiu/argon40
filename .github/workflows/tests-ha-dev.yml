name: Tests (Home Assistant dev)

# A daily compatibility warning; keep it separate from the stable release checks.
on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ha-dev:
    name: Pytest against Home Assistant dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --frozen --group test
      - name: Install matching HA dev and official test helpers
        run: |
          uv pip uninstall pytest-homeassistant-custom-component
          uv pip install --prerelease=allow \
            'homeassistant @ git+https://github.com/home-assistant/core.git@dev' \
            'pytest-home-assistant @ git+https://github.com/home-assistant/core.git@dev#subdirectory=packages/pytest-home-assistant'
      - name: Show Home Assistant version
        run: uv run --no-sync python -c 'from homeassistant.const import __version__; print(__version__)'
      - name: Run integration tests
        # --no-sync preserves the HA dev override instead of restoring the stable lock.
        # HA must initialize its HTTP alias before respx is imported.
        run: uv run --no-sync python -m pytest -p no:respx --no-cov
