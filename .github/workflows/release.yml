name: Release actions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create integration archive
        working-directory: custom_components/argon40
        run: zip -r "${RUNNER_TEMP}/argon40.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/argon40.zip" --clobber
